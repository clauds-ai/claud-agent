[package]
name = "distr_core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sysinfo = "0.30"  # Для збору метрик CPU, RAM, дисків, процесів
nix = "0.28"     # Для низькорівневого доступу до системних викликів (опціонально)
procfs = "0.16"  # Для читання /proc (опціонально)