[package]
name = "api"
version = "0.1.0"
edition = "2021"
build = "build.rs"  # Tell Cargo to use the build script

[build-dependencies]
tonic-build = "0.10"  # Required for Protobuf code generation

[dependencies]
core = { path = "../core" }
services = { path = "../services" }
infrastructure = { path = "../infrastructure" }
tokio = { version = "1.0", features = ["full"] }
tonic = "0.10"
prost = "0.12"
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
